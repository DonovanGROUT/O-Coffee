# Regroupement dev/prod : les bumps patch/minor arrivent en 2 PR max par semaine
# (une dev, une prod). Les majeurs sortent en PR individuelles = revue manuelle.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    labels:
      - dependencies
    groups:
      dev-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch
      prod-dependencies:
        dependency-type: production
        update-types:
          - minor
          - patch
